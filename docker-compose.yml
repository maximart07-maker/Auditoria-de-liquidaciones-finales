# Nombre fijo del proyecto: los contenedores y el volumen de la base de datos
# no dependen del nombre de la carpeta (renombrarla no crea una base vacía).
name: auditoria-de-liquidaciones-finales

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
      POSTGRES_DB: auditoria_liquidaciones
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    # Opcional: la API todavía no usa almacenamiento de objetos, así que MinIO
    # no arranca con `docker compose up -d`. Solo se levanta con
    # `docker compose --profile almacenamiento up -d`.
    # Ojo: MinIO dejó de publicar imágenes para descarga anónima (Docker Hub y
    # quay.io responden 401), así que levantarlo requiere `docker login` o una
    # imagen alternativa compatible con S3.
    profiles: ["almacenamiento"]
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
